<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />
    <title>Smart Court</title>
    <!-- Apply the saved theme before first paint, so light-mode users never see
         dark-mode colours flash and fade on load. Mirrors hooks/useTheme.jsx. -->
    <script>
      try {
        var t = localStorage.getItem('smartcourt:theme') || 'dark'
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist Sans + Geist Mono (Vercel) — modern variable type. Instrument Serif for accent headlines. Noto Nastaliq for proper Urdu. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Instrument+Serif:ital@0;1&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
